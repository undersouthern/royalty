<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royalty Portal - UNDERSOUTHERN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-6 select-none font-sans">
  <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-8 text-center space-y-6 shadow-2xl">
    <!-- Status Indicator -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      Hệ thống đang hoạt động
    </div>

    <!-- Main Title -->
    <div class="space-y-2">
      <h1 class="text-2xl font-bold tracking-tight text-white">Royalty Portal</h1>
      <p class="text-sm text-zinc-400">UNDERSOUTHERN Asia Distribution</p>
    </div>

    <!-- Domain Info Box -->
    <div class="bg-zinc-950/60 rounded-xl p-4 border border-zinc-800/80 text-left space-y-2">
      <div class="flex justify-between items-center text-xs">
        <span class="text-zinc-500">Domain</span>
        <span class="text-zinc-300 font-mono">royalty.undersouthern.asia</span>
      </div>
      <div class="flex justify-between items-center text-xs">
        <span class="text-zinc-500">Edge Network</span>
        <span class="text-zinc-300">Cloudflare Pages</span>
      </div>
      <div class="flex justify-between items-center text-xs">
        <span class="text-zinc-500">Trạng thái build</span>
        <span class="text-emerald-400 font-semibold">Thành công</span>
      </div>
    </div>

    <!-- Footer Note -->
    <p class="text-xs text-zinc-600">
      Đang chuẩn bị khởi tạo giao diện tra cứu doanh thu & sao kê bản quyền.
    </p>
  </div>
</body>
</html>
